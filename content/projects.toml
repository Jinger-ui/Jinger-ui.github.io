summary = "Contributed to an IEEE ICSECS 2023 publication on return-oriented programming mitigation combining operating-system protections with hardware-assisted control-flow monitoring. The framework analyzes trade-offs among ASLR, DEP, and Intel LBR for branch anomaly detection in virtualized environments. A workflow integrating overflow mitigation, LBR analysis, and VMI improves visibility into indirect jumps and supports visualization-driven alerting."
image = "/projects/Rop-cover.png"
detailImages = ["/projects/Rop-cover02.png"]
tags = ["ASLR", "DEP", "LBR", "VMI"]
content = """- Defenses spanning **ROP** mitigation: OS + hardware-assisted monitoring.
- Analyzed ASLR/DEP/**Intel LBR** trade-offs; abnormal-branch detection resilience.
- Defense workflow: buffer-overflow mitigation + LBR analysis + **VMI** legitimacy checks for indirect jumps in VMs.
- Concept: Turing-detection tooling with baseline control-flow compare, Viz, alerts, NLP discrepancy summaries.
- **IEEE ICSECS 2023** pp.453–458, DOI 10.1109/ICSECS58457.2023.10256382."""
