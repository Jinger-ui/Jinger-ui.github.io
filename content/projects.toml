[[items]]
title = "BERT — Car Reviews (Topic & Sentiment)"
subtitle = "Project Lead · Publication · EMIE 2023 · Proc. SPIE 12919"
date = "2023"
summary = "As project lead, I built a BERT-based framework for automotive review topic and sentiment classification, published at EMIE 2023 (Proc. SPIE 12919). A custom summative attention mechanism with domain vocabulary injection and penalty loss for class imbalance improved topic accuracy from 0.676 to 0.816 and sentiment accuracy from 0.701 to 0.746. I owned the full pipeline from preprocessing and augmentation through training, validation, and baseline comparison."
image = "/projects/Bert-carreview-cover.png"
detailImages = ["/projects/Bert-carreview-cover02.png"]
tags = ["BERT", "NLP"]
content = """- Two-person publication team: automotive review **topic** + **sentiment** classification.
- **Summative attention** injecting summarized domain vocab into BERT (position & weight matrices); stronger salience vs vanilla BERT.
- Penalty-loss for **imbalance**; pipeline: preprocessing, augmentation, train/validation, benchmarking.
- Topic accuracy **0.676 → 0.816**; epochs **70 → 20**; sentiment **0.701 → 0.746**.
- Published: study on summative attention in BERT for car reviews (**SPIE**).
- Methods: Python, BERT, imbalanced-learning, augmentation, Adam, cosine scheduler."""

