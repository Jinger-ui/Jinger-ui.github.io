[[items]]
title = "EcoGo — Sustainability Capstone"
subtitle = "Full Stack Developer · NUS-ISS Graduate Diploma · Singapore"
date = "2026"
summary = "EcoGo is a sustainability capstone that helps campus users choose lower-carbon travel options. As technical lead, I coordinated a six-member team building route-level carbon visibility, personalized recommendations, and an AI mobility assistant across mobile, backend, and data pipelines. The platform integrates NUS NextBus and Google Directions for emissions-aware routing, complemented by a LoRA-based RAG assistant powered by Elasticsearch and Kafka-driven document processing."
image = "/projects/ecogo-cover.png"
detailImages = ["/projects/ecogo-cover02.png"]
tags = ["React", "Kotlin", "Spring Boot", "Python", "RAG", "Kafka", "Elasticsearch", "CI/CD"]
content = """- Full-stack developer on a six-member capstone team delivering **EcoGo**: route-level **carbon visibility**, recommendation workflows, and AI-assisted mobility guidance.
- Built across the stack: React, Kotlin, Java **Spring Boot**, Python, MongoDB, MySQL, Redis, MinIO, Elasticsearch, Docker, SonarQube, JUnit, **GitHub Actions** — owned **Android**, **ML**, and **CI/CD** personally.
- **Low-carbon routing** integrating **NUS NextBus** and **Google Directions** APIs with carbon estimation; compare routes by time and emissions.
- **LoRA²** conversational assistant (**Ollama** middleware + intent detection); **RAG** via Apache Tika, chunking/embeddings, **Elasticsearch hybrid** retrieval (KNN + IK keywords + BM25 re-ranking), **Kafka** async parsing/vectorization/indexing pipelines."""

