name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      
      - run: npm install
      
      - name: Lint
        run: npm run lint
      
      - name: Build
        run: npm run build
      
      - name: Validate project categories
        run: node js/validate-projects.js
